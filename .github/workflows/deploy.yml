name: Deploy Website to S3

on:
  push:
    branches:
      - main  # Triggers the workflow whenever code is pushed to main

permissions:
  id-token: write # Required for requesting the AWS JWT token
  contents: read  # Required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the source code
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims (Decoded)
        run: |
          # Fetch the token from GitHub's internal API
          RESPONSE=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          JWT=$(echo "$RESPONSE" | jq -r '.value')
          
          # Extract the middle part (payload) of the JWT and decode it
          echo "------ DECODED OIDC CLAIMS ------"
          echo "$JWT" | cut -d'.' -f2 | base64 --decode 2>/dev/null | jq .
          echo "---------------------------------"


      # Step 2: Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810761468352:role/billrole # Paste your IAM Role ARN here
          aws-region: us-west-2 # Replace with your bucket's AWS region

      # Step 3: Sync local files to the S3 Bucket
      - name: Deploy static site to S3
        run: |
          aws s3 sync . s3://vfdbkjnekbjneibjnribhtnbir --delete --exclude ".git/*" --exclude ".github/*"
